basePath: /
definitions:
  main.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
  main.Book:
    properties:
      author:
        type: string
      id:
        type: integer
      title:
        type: string
    required:
    - author
    - title
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API buku sederhana pakai Go
  title: My First API
  version: "1.0"
paths:
  /books:
    get:
      description: Ambil semua daftar buku
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.Book'
                  type: array
              type: object
      summary: Get all books
      tags:
      - books
    post:
      consumes:
      - application/json
      description: Tambah buku baru ke collection
      parameters:
      - description: Book object
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/main.Book'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/main.Book'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: Add a new book
      tags:
      - books
swagger: "2.0"
